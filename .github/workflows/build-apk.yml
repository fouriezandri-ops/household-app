name: Build Android APK

# Builds one sideloadable release APK per household profile
# (household_profiles/*.json — see that directory's README) on GitHub's own
# runners. This exists because the app's usual dev environment has no
# Android SDK / no network access to Google's SDK repository — GitHub
# Actions runners come with the Android SDK preinstalled, so this is the
# easiest way to get an installable APK without setting up Android tooling
# locally.
on:
  workflow_dispatch: {}
  push: {}

jobs:
  discover-profiles:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          profiles=$(ls household_profiles/*.json | xargs -n1 basename | sed 's/\.json$//' | grep -v '^_' | jq -R . | jq -sc .)
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"

  build:
    needs: discover-profiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ${{ fromJson(needs.discover-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - run: flutter pub get

      - name: Apply the ${{ matrix.profile }} household profile
        run: dart run tool/apply_household_profile.dart household_profiles/${{ matrix.profile }}.json

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: household-app-release-apk-${{ matrix.profile }}
          path: build/app/outputs/flutter-apk/app-release.apk
